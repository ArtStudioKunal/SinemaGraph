name: Sinemagraph Windows EXE

on:
  push:
    branches: [rebrand/sinemagraph, main]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'assets/**'
      - 'tools/sinemagraph/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sinemagraph-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinemagraph-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon renderer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Apply Sinemagraph brand logo
        run: python tools/sinemagraph/generate_icons.py
      - name: Prepare Rust toolchain
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version
      - name: Format Rust sources for build
        run: cargo fmt --all
      - name: Build Sinemagraph Windows executable
        env:
          FILMCRAFT_REQUIRE_WINRES: "1"
        run: cargo build --release --locked -p filmcraft --bin sinemagraph
      - name: Validate EXE and bundle notices
        shell: pwsh
        run: |
          if (-not (Test-Path 'target/release/sinemagraph.exe')) { throw 'Sinemagraph EXE not created' }
          Get-Item 'target/release/sinemagraph.exe' | Format-List Name,Length,LastWriteTime
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sinemagraph.exe dist/
          Copy-Item LICENSE-MIT,LICENSE-APACHE,NOTICE,ATTRIBUTION.md dist/
      - name: Upload compiled Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sinemagraph-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Package Windows preview download
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish Sinemagraph preview'))
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/*' -DestinationPath 'Sinemagraph-Windows-x64.zip' -CompressionLevel Optimal -Force
          if (-not (Test-Path 'Sinemagraph-Windows-x64.zip')) { throw 'Windows ZIP bundle not created' }
          $exeHash = (Get-FileHash 'dist/sinemagraph.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash 'Sinemagraph-Windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  sinemagraph.exe" | Set-Content -Path 'SHA256SUMS.txt' -Encoding utf8
          "$zipHash  Sinemagraph-Windows-x64.zip" | Add-Content -Path 'SHA256SUMS.txt' -Encoding utf8
      - name: Publish GitHub Windows preview release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publish Sinemagraph preview'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "sinemagraph-preview-${{ github.run_number }}"
          $notes = @'
          Preview build of Sinemagraph for Windows x64.

          - Includes the compiled sinemagraph.exe and a ZIP bundle with LICENSE-MIT, LICENSE-APACHE, NOTICE and ATTRIBUTION.md.
          - Automated CI passed before merge; hands-on Windows editing, docking, media import and export testing is still recommended before a stable release.
          - AI auto-editing is not included.
          '@
          $notes | Set-Content -Path 'sinemagraph-preview-notes.md' -Encoding utf8
          gh release create $tag 'dist/sinemagraph.exe#sinemagraph.exe' 'Sinemagraph-Windows-x64.zip#Sinemagraph-Windows-x64.zip' 'SHA256SUMS.txt#SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Sinemagraph Windows Preview ($tag)" --notes-file 'sinemagraph-preview-notes.md' --prerelease
      - name: Save generated icons to fork after successful build
        if: github.ref == 'refs/heads/rebrand/sinemagraph'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/app-icon apps/filmcraft-web/web/favicon.png apps/filmcraft-web/web/favicon.png.attribution
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: store generated Sinemagraph icons"
            git push origin "HEAD:rebrand/sinemagraph"
          }
